[package]
name = "simplicity-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "simplicity_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
simplicity-core = { path = "../crates/engine-core" }
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "std"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "objc2-core-foundation", "std"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
