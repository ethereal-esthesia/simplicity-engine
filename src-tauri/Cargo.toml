[package]
name = "simplicity-app"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "simplicity_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
simplicity-core = { path = "../crates/engine-core" }
tauri = { version = "2", features = ["macos-private-api"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSAnimation", "NSAnimationContext", "NSColor", "NSResponder", "NSView", "NSWindow", "block2", "objc2-core-graphics", "objc2-quartz-core", "std"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSProcessInfo", "objc2-core-foundation", "std"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer", "CAMediaTimingFunction", "objc2-core-graphics", "std"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
