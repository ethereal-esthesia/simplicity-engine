<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simplicity Engine</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main id="window-surface" aria-label="Simplicity Engine window">
    <button id="floating-expand" type="button" aria-label="Expand artwork" hidden
            aria-controls="expanded-artwork" aria-expanded="false">
      <img src="./assets/window-mark.svg" alt="" aria-hidden="true" draggable="false">
    </button>
    <img id="expanded-artwork" src="./assets/window-mark.svg"
         alt="Two overlapping window outlines" draggable="false">
    <div id="diagram-view" aria-label="Mermaid diagram" aria-hidden="true">
      <div id="diagram" role="button" tabindex="-1"
           aria-label="Click a flowchart node to toggle disabled, or press Enter to edit Mermaid source"></div>
      <textarea id="diagram-source" aria-label="Mermaid source"
                aria-hidden="true" tabindex="-1" wrap="soft" spellcheck="false"></textarea>
      <p id="diagram-error" role="alert" hidden></p>
    </div>
    <p id="status" role="status" hidden></p>
  </main>
</body>
</html>
