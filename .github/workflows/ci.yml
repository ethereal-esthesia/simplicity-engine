name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: brew install ninja
      - name: Debug build and tests
        run: |
          cmake --preset debug
          cmake --build --preset debug
          ctest --test-dir build/debug --output-on-failure
      - name: Release build and tests
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --test-dir build/release --output-on-failure
      - name: iOS setup regression tests
        run: python3 tests/test_ios_setup.py
      - name: Build Matte Overlay
        run: bash tools/matte-overlay/build.sh
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build iPhone simulator app
        run: |
          cmake --preset ios-iphone-simulator-debug
          cmake --build --preset ios-iphone-simulator-debug --config Debug
      - name: Build iPhone Menu Studio
        run: ./scripts/menu_demo.sh build ios-phone
