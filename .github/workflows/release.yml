name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  macos-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs_on: macos-latest
            cmake_arch: arm64
          - arch: x64
            runs_on: macos-latest
            cmake_arch: x86_64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja
        run: brew install ninja

      - name: Package macOS archive
        env:
          ARCH_LABEL: ${{ matrix.arch }}
          MACOS_CMAKE_ARCH: ${{ matrix.cmake_arch }}
        run: ./tools/package_macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/simplicity-engine-macos-${{ matrix.arch }}.tar.gz

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - macos-release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/release-macos-*/simplicity-engine-macos-*.tar.gz
          generate_release_notes: true
