[package]
name = "video-player"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "video_player"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
